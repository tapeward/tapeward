  .off p { color: var(--dim); margin: 0; }
  .off .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .bars { height: 10px; width: min(420px, 80vw); margin: 0 auto; background: linear-gradient(90deg, var(--red) 0 33%, var(--purple) 33% 66%, var(--blue) 66%); }
</style>
