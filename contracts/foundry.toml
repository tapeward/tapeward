[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./feeds.json" },
]

[fuzz]
runs = 1000

[fmt]
line_length = 110

[lint]
lint_on_build = false
