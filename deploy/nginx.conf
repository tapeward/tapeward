# /etc/nginx/sites-available/tapeward — tapeward.live (+ www → apex). Installed by deploy/provision.sh (overwrites the lead's temporary
# ACME/503 site), which substitutes DOMAIN for "tapeward.live" and the API port for PORT_PLACEHOLDER (4884).
# Static site from /srv/tapeward/web with clean URLs; /api/ and /r/ (share pages with OG tags) → Node on 127.0.0.1:PORT.
limit_req_zone $binary_remote_addr zone=tapeward_pick:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tapeward.live www.tapeward.live;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://tapeward.live$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tapeward.live;
    ssl_certificate /etc/letsencrypt/live/tapeward.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapeward.live/privkey.pem;
    include /etc/nginx/tapeward-headers.conf;
    return 301 https://tapeward.live$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tapeward.live;
    ssl_certificate /etc/letsencrypt/live/tapeward.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tapeward.live/privkey.pem;

    root /srv/tapeward/web;
    index index.html;
    charset utf-8;
    include /etc/nginx/tapeward-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json text/plain application/xml;
    gzip_static on;

    # /api/ and /r/ are ^~ prefixes so the static-file regex locations below (e.g. \.png$) never catch /api/card/….png
    location ^~ /api/ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/tapeward-proxy.conf;
        client_max_body_size 1k;
        proxy_read_timeout 60s;

        location = /api/stream {
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
            include /etc/nginx/tapeward-proxy.conf;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 1h;
            add_header X-Accel-Buffering no always;
            include /etc/nginx/tapeward-headers.conf;
        }
        # the only write routes: a signed pick / a signed desk name (small JSON)
        location ~ ^/api/(pick|desk)$ {
            limit_except POST OPTIONS { deny all; }
            limit_req zone=tapeward_pick burst=10 nodelay;
            proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
            include /etc/nginx/tapeward-proxy.conf;
            client_max_body_size 4k;
            proxy_read_timeout 30s;
        }
    }
    # the share page script is a static file inside /r/ (exact match beats the ^~ prefix below)
    location = /r/share.js { include /etc/nginx/tapeward-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location ^~ /r/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/tapeward-proxy.conf;
    }

    location = /token.json { include /etc/nginx/tapeward-headers.conf; add_header Cache-Control "no-store" always; try_files $uri =404; }
    location = /rules.json { include /etc/nginx/tapeward-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }

    location ^~ /vendor/ {
        include /etc/nginx/tapeward-headers.conf;
        types { text/javascript js mjs; application/json json; text/css css; application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/fonts/ { include /etc/nginx/tapeward-headers.conf; types { font/woff2 woff2; font/woff woff; } add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

    location ~ /\.(?!well-known) { deny all; }
    location ^~ /dev/ { return 404; }

    location ~* \.webmanifest$ { include /etc/nginx/tapeward-headers.conf; types { } default_type application/manifest+json; add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
    location ~* \.(woff2?|png|jpe?g|webp|avif|gif|ico|svg|mp4|webm|glb|wasm)$ { include /etc/nginx/tapeward-headers.conf; add_header Cache-Control "public, max-age=604800" always; try_files $uri =404; }
    location ~* \.(js|mjs|css|json|xml|txt)$ { include /etc/nginx/tapeward-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }

    location / {
        include /etc/nginx/tapeward-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
